<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Abfahrten Goslarsche Straße</title>
<style>
  :root {
    --bg: #0b0f14; --panel: #131a22; --line: #1f2933;
    --text: #f2f5f7; --muted: #8a97a5; --amber: #ffb000;
    --late: #ff5d5d; --ok: #4cd38a; --tram: #d6002a; --bus: #0a6cc4;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { padding: 16px 14px 28px; max-width: 560px; margin: 0 auto; }
  header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 14px; }
  h1 { font-size: 20px; margin: 0; font-weight: 700; }
  .sub { font-size: 12px; color: var(--muted); margin-top: 3px; }
  #clock { font-size: 26px; font-weight: 700; color: var(--amber); font-variant-numeric: tabular-nums; }
  ul { list-style: none; margin: 0; padding: 0; background: var(--panel); border-radius: 14px; overflow: hidden; }
  li { display: grid; grid-template-columns: 52px 1fr auto; gap: 12px; align-items: center;
    padding: 13px 14px; border-bottom: 1px solid var(--line); }
  li:last-child { border-bottom: 0; }
  .badge { text-align: center; font-weight: 800; font-size: 17px; padding: 6px 0; border-radius: 8px;
    background: var(--bus); color: #fff; font-variant-numeric: tabular-nums; }
  .badge.tram { background: var(--tram); }
  .dest { font-size: 16px; font-weight: 600; line-height: 1.25; overflow-wrap: anywhere; }
  .meta { font-size: 12px; color: var(--muted); margin-top: 3px; font-variant-numeric: tabular-nums; }
  .meta .late { color: var(--late); font-weight: 700; }
  .meta .ok { color: var(--ok); }
  .mins { text-align: right; font-size: 22px; font-weight: 800; color: var(--amber);
    font-variant-numeric: tabular-nums; white-space: nowrap; }
  .mins small { font-size: 12px; font-weight: 600; color: var(--muted); margin-left: 2px; }
  li.cancelled .dest { text-decoration: line-through; color: var(--muted); }
  li.cancelled .mins { font-size: 13px; color: var(--late); }
  #status { font-size: 12px; color: var(--muted); margin-top: 12px; text-align: center; line-height: 1.5; }
  #status.error { color: var(--late); }
  .empty { padding: 26px 14px; text-align: center; color: var(--muted); display: block; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Goslarsche Straße</h1>
    <div class="sub">Braunschweig · Abfahrten live</div>
  </div>
  <div id="clock">--:--</div>
</header>

<ul id="board"><li class="empty">Lade Abfahrten …</li></ul>
<div id="status"></div>

<script>
// ---- Einstellungen ----
const STOP_ID = "de:03101:152";      // Braunschweig, Goslarsche Straße
const LIMIT = 12;                     // Anzahl Abfahrten
const REFRESH_SECONDS = 30;           // Aktualisierung
const API = "https://bsvg.efa.de/bsvagstd/XML_DM_REQUEST";

const board = document.getElementById("board");
const statusEl = document.getElementById("status");
const clockEl = document.getElementById("clock");
let events = [];
let lastOk = null;

const hhmm = d => d.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function buildUrl() {
  const p = new URLSearchParams({
    outputFormat: "rapidJSON", type_dm: "stop", name_dm: STOP_ID,
    mode: "direct", useRealtime: "1", depType: "stopEvents",
    limit: String(LIMIT), version: "10.4.18.18"
  });
  return API + "?" + p.toString();
}

function jsonp(url) {
  return new Promise((resolve, reject) => {
    const cb = "efaCb" + Date.now() + Math.floor(Math.random() * 1000);
    const s = document.createElement("script");
    const done = () => { clearTimeout(timer); delete window[cb]; s.remove(); };
    const timer = setTimeout(() => { done(); reject(new Error("Zeitüberschreitung")); }, 15000);
    window[cb] = d => { done(); resolve(d); };
    s.onerror = () => { done(); reject(new Error("Server nicht erreichbar")); };
    s.src = url + "&jsonp=" + cb + "&_=" + Date.now();
    document.head.appendChild(s);
  });
}

async function load() {
  try {
    const data = await jsonp(buildUrl());
    events = (data.stopEvents || []).map(parse).filter(Boolean);
    lastOk = new Date();
    statusEl.className = "";
    render();
  } catch (e) {
    statusEl.className = "error";
    statusEl.textContent = "Keine Verbindung zum BSVG-Server (" + e.message + "). Neuer Versuch läuft automatisch.";
    if (!events.length) board.innerHTML = '<li class="empty">Keine Daten</li>';
  }
}

function parse(ev) {
  const planned = ev.departureTimePlanned ? new Date(ev.departureTimePlanned) : null;
  if (!planned) return null;
  const est = ev.departureTimeEstimated ? new Date(ev.departureTimeEstimated) : null;
  const t = ev.transportation || {};
  const prod = t.product || {};
  const dest = ((t.destination || {}).name || "").replace(/^Braunschweig,?\s*/i, "");
  const cancelled = ev.isCancelled === true ||
    (ev.realtimeStatus || []).some(s => /CANCEL/i.test(s));
  return {
    line: t.number || t.disassembledName || "?",
    tram: prod.class === 4 || /bahn|tram/i.test(prod.name || ""),
    dest: dest || "—",
    planned, est, realtime: !!est && ev.isRealtimeControlled === true, cancelled,
    platform: ((ev.location || {}).properties || {}).platformName ||
              ((ev.location || {}).properties || {}).platform || ""
  };
}

function render() {
  const now = new Date();
  clockEl.textContent = hhmm(now);
  const rows = events
    .map(e => ({ ...e, when: e.est || e.planned }))
    .filter(e => e.when - now > -45000)
    .sort((a, b) => a.when - b.when);

  if (!rows.length) {
    board.innerHTML = '<li class="empty">Aktuell keine Abfahrten</li>';
  } else {
    board.innerHTML = rows.map(e => {
      const mins = Math.max(0, Math.round((e.when - now) / 60000));
      const delay = e.est ? Math.round((e.est - e.planned) / 60000) : 0;
      let info = "Plan " + hhmm(e.planned);
      if (e.realtime) info += delay > 0
        ? ' · <span class="late">+' + delay + " min</span>"
        : ' · <span class="ok">pünktlich</span>';
      else info += " · ohne Live-Daten";
      if (e.platform) info += " · Steig " + esc(e.platform);
      const right = e.cancelled ? "fällt aus" : (mins === 0 ? "sofort" : mins + "<small>min</small>");
      return '<li class="' + (e.cancelled ? "cancelled" : "") + '">' +
        '<div class="badge ' + (e.tram ? "tram" : "") + '">' + esc(e.line) + "</div>" +
        '<div><div class="dest">' + esc(e.dest) + '</div><div class="meta">' + info + "</div></div>" +
        '<div class="mins">' + right + "</div></li>";
    }).join("");
  }
  if (lastOk && statusEl.className !== "error")
    statusEl.textContent = "Stand " + lastOk.toLocaleTimeString("de-DE") + " · Daten: BSVG / EFA";
}

load();
setInterval(load, REFRESH_SECONDS * 1000);
setInterval(render, 5000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
</script>
</body>
</html>
